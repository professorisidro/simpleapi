server.port=8080
spring.application.name=simpleapi

# Behind a reverse proxy / TLS terminator (e.g. Cloudflare tunnel): honor the
# X-Forwarded-* headers so the app (and Swagger's "servers" URL) uses https/the
# external host instead of the internal http origin.
server.forward-headers-strategy=framework

# H2 (file mode)
spring.datasource.url=jdbc:h2:file:./data/simpleapi;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow remote (non-localhost) browser connections to the console.
# WARNING: exposes a DB admin UI; keep the /h2-console route protected (see SecurityConfig HTTP Basic).
spring.h2.console.settings.web-allow-others=true

# Application-specific JWT settings.
# HS256 secret MUST be at least 32 bytes. Override via env in production.
app.jwt.secret=change-this-secret-to-a-long-random-value-at-least-32-bytes-long!!
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
